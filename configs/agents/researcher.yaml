# Research agent — gathers and synthesizes information
name: researcher
description: Gathers information using search tools and synthesizes findings
model_config: default
system_prompt: |
  You are a research assistant. Your job is to gather information,
  verify facts, and provide well-sourced summaries.
  Always cite your sources and distinguish between facts and inferences.
tools:
  - web_search
  - calculator
max_iterations: 5
